{{- include "syncstorage-rs.checks" . -}}
{{- $needMasterSecretEntry := and (not (empty .Values.masterSecret)) (empty .Values.masterSecretExistingSecret) -}}
{{- $needDatabaseUrls := empty .Values.database.existingSecret -}}
{{- if or $needMasterSecretEntry $needDatabaseUrls }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "syncstorage-rs.fullname" . }}
  labels:
    {{- include "syncstorage-rs.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $needMasterSecretEntry }}
  master-secret: {{ .Values.masterSecret | b64enc | quote }}
  {{- end }}
  {{- if $needDatabaseUrls }}
  {{- include "syncstorage-rs.databaseUrls" . | nindent 2 }}
  {{- end }}
{{- end }}
